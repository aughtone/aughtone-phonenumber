[versions]
namespace = "io.github.aughtone.phonenumber"
group = "io.github.aughtone"
versionName = "0.0.2"

# The pinned libphonenumber metadata release this port embeds. The pin is a
# change detector: bump it to adopt an upstream release only after confirming the
# refresh changes no E.164 we already produce (new regions/ranges are fine); a
# bump that would change existing output is a called-out breaking change. Exposed
# at runtime via PhoneNumberUtil.metadataVersion. Keep in sync with
# METADATA_VERSION in phonenumber's Metadata.kt (and the test dep below).
libphonenumberMetadata = "9.0.39"

android-minSdk = "24"
android-compileSdk = "37"

agp = "9.2.1"
kotlin = "2.4.0"
kotlinx-serialization = "1.11.0"
kotlinx-datetime = "0.8.0"
vanniktech = "0.37.0"
kotlinBrowser = "2026.7.1"

[libraries]
kotlin-browser = { module = "org.jetbrains.kotlin-wrappers:kotlin-browser", version.ref = "kotlinBrowser" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
# Reference implementation, JVM-test only. Version pinned to the embedded metadata
# epoch so ground-truth comparisons never drift from what we ship.
libphonenumber-java = { module = "com.googlecode.libphonenumber:libphonenumber", version.ref = "libphonenumberMetadata" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }

[plugins]
multiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
vanniktech-mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktech" }
